name: Build Henge 0.4 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build IPA
        run: |
          make || xcodebuild -scheme Henge -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Henge.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
            zip -r Henge.ipa Payload
          fi

      - name: Upload Henge IPA
        uses: actions/upload-artifact@v4
        with:
          name: Henge-0.4-IPA
          path: |
            Henge.ipa
            *.ipa
            build/*.ipa
            ~/Desktop/Henge.ipa
